name: E2E

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  chromium:
    name: Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # global setup builds the extension before the tests run
      - name: Run e2e tests
        run: npm run test:e2e:chromium

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  firefox-smoke:
    name: Firefox smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Firefox and geckodriver come preinstalled on ubuntu-latest
      - name: Run e2e tests
        run: npm run test:e2e:firefox

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-firefox-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
